services:
  - type: web
    name: augmented-yutnori-online
    runtime: node
    plan: free
    region: singapore
    rootDir: games/augmented-yutnori
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod
    startCommand: node server/index.js
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: ONLINE_TRUST_PROXY
        value: "1"
      - key: ONLINE_ALLOWED_ORIGINS
        sync: false
      - key: ONLINE_DATA_FILE
        value: ":memory:"
